title: "A mente do Espírito"
description: >-
  Nesta importante obra, Craig Keener, renomado estudioso do Novo Testamento, explora uma área importante mas geralmente negligenciada da teologia paulina: o ensinamento de Paulo sobre a mente. Paulo fala da mente corrompida e da mente da carne, mas também fala da mente de Cristo, da mente do Espírito e da renovação da mente. Ao articular esse tema, Paulo adapta a linguagem própria da reflexão intelectual popular de seu tempo, fazendo-o de forma claramente focada em Cristo e no papel de Cristo na transformação do crente. Keener permite que os leitores entendam esse mundo do pensamento para que possam interpretar as formulações de Paulo para a vida cristã contemporânea. A mente do Espírito ajuda a superar uma falsa separação entre seguir o Espírito e usar o intelecto humano. Também fornece uma nova base para relacionar os estudos bíblicos com o aconselhamento cristão. Tal contribuição atrairá professores, alunos e estudiosos do Novo Testamento, bem como pastores e líderes de igreja.
